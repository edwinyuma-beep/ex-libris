<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1D5A43">
<title>Ex Libris</title>
<link rel="stylesheet" href="vendor/fonts.css">
<style>
/* Layout: a catalog drawer. Cloth-bound covers on a quiet shelf, catalog-card metadata in mono, a reading room that gets out of the way. */
:root{
  --bg:#F1F3EF; --surface:#FFFFFF; --sunken:#E5E9E3; --ink:#16201B; --muted:#5A6760; --line:#D3D9D2;
  --accent:#1D5A43; --accent-soft:#DCEBE3; --on-accent:#FFFFFF; --danger:#A3352A;
  --hl-yellow:rgba(240,196,60,.42); --hl-green:rgba(98,186,122,.36); --hl-blue:rgba(92,152,228,.34); --hl-pink:rgba(232,108,156,.34);
  --dot-yellow:#D9A82A; --dot-green:#3F9A5E; --dot-blue:#3F7FD1; --dot-pink:#D04E86;
  --shadow:0 1px 2px rgba(18,32,26,.07),0 10px 28px rgba(18,32,26,.09);
  --f-ui:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-bg:var(--surface); --r-ink:var(--ink); --r-muted:var(--muted);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1311; --surface:#161D19; --sunken:#1F2823; --ink:#E1E8E3; --muted:#93A198; --line:#2A3530;
  --accent:#7CC6A2; --accent-soft:#1E3329; --on-accent:#0A1811; --danger:#EC8574;
  --hl-yellow:rgba(240,196,60,.30); --hl-green:rgba(98,186,122,.30); --hl-blue:rgba(92,152,228,.32); --hl-pink:rgba(232,108,156,.30);
  --dot-yellow:#E6BC45; --dot-green:#5CB87A; --dot-blue:#6EA3EA; --dot-pink:#E2709E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1311; --surface:#161D19; --sunken:#1F2823; --ink:#E1E8E3; --muted:#93A198; --line:#2A3530;
  --accent:#7CC6A2; --accent-soft:#1E3329; --on-accent:#0A1811; --danger:#EC8574;
  --hl-yellow:rgba(240,196,60,.30); --hl-green:rgba(98,186,122,.30); --hl-blue:rgba(92,152,228,.32); --hl-pink:rgba(232,108,156,.30);
  --dot-yellow:#E6BC45; --dot-green:#5CB87A; --dot-blue:#6EA3EA; --dot-pink:#E2709E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
input,button,select,textarea{-webkit-appearance:none;appearance:none}
input[type=range]{-webkit-appearance:auto;appearance:auto}
select.sel{background-image:none}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:650;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit}
input,textarea,select{font:inherit;color:var(--ink)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.86em;letter-spacing:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{display:inline-flex;width:1.15em;height:1.15em;flex:none}
.ic svg{width:100%;height:100%}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:.5em;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.6em 1.05em;font-weight:550;cursor:pointer;line-height:1.1;min-height:42px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:36px;padding:.45em .85em;font-size:.9rem}
.btn:disabled{opacity:.55;cursor:default}
.ib{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:999px;border:0;background:transparent;cursor:pointer;color:inherit}
.ib:hover{background:var(--sunken)}
.ib[aria-pressed="true"]{color:var(--accent)}
.ib .ic{width:22px;height:22px}
.link{border:0;background:none;padding:.2em 0;cursor:pointer;color:var(--accent);font-weight:550;display:inline-flex;gap:.35em;align-items:center}
.link.danger{color:var(--danger)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* shell */
.shell{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 120px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:6px 22px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.plate{width:46px;height:46px;flex:none;color:var(--accent)}
.brand h1{font-size:1.65rem;font-weight:700;letter-spacing:-.025em;line-height:1}
.brand .sub{color:var(--muted);font-size:.86rem;margin-top:3px}
#addTop{display:none}
@media (min-width:720px){#addTop{display:inline-flex}.fab{display:none!important}}

/* continue */
.cont{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:26px}
.cont-cover{border:0;background:none;padding:0;cursor:pointer;width:104px}
.cont-body{min-width:0;display:grid;gap:8px}
.cont-title{font-size:1.4rem;line-height:1.15}
@media (max-width:480px){.cont{gap:14px;padding:14px}.cont-cover{width:82px}.cont-title{font-size:1.15rem}}

.prog{display:flex;align-items:center;gap:10px}
.pbar{flex:1;height:5px;border-radius:9px;background:var(--sunken);overflow:hidden;min-width:40px}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
.pbar.lg{height:8px}
.prog .mono{color:var(--muted);white-space:nowrap}

/* stats + toolbar */
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;margin-bottom:16px;color:var(--muted);font-size:.92rem}
.stats b{color:var(--ink);font-family:var(--f-mono);font-weight:500;font-size:1.05rem;margin-right:5px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px;min-height:44px;color:var(--muted)}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;min-height:42px}
.search:focus-within{border-color:var(--accent)}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 14px;min-height:44px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:.4em .9em;cursor:pointer;white-space:nowrap;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-family:var(--f-mono);font-size:.78rem;opacity:.7;margin-left:4px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:26px 18px}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}}
.card{border:0;background:none;padding:0;text-align:left;cursor:pointer;display:grid;gap:7px;align-content:start;min-width:0}
.card h3{font-size:.98rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .muted{font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cover{transition:transform .2s}
.card:hover .cover{transform:translateY(-3px)}
.card-tags{display:flex;gap:6px;align-items:center;margin-top:3px}
.tag{font-size:.66rem;letter-spacing:.08em;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}
.tag.done{color:var(--accent);border-color:var(--accent)}
.nohits{color:var(--muted);padding:30px 0}
.storage-note{margin-top:40px;color:var(--muted);font-size:.85rem;max-width:60ch}

/* covers */
.cover{position:relative;aspect-ratio:2/3;width:100%;max-width:100%;border-radius:3px 7px 7px 3px;overflow:hidden;background:var(--cloth,#2F4A3E);color:var(--foil,#E6D9A9);box-shadow:inset 7px 0 0 rgba(0,0,0,.2),inset 8px 0 0 rgba(255,255,255,.07),0 1px 1px rgba(0,0,0,.12),0 8px 18px rgba(10,20,15,.18);display:flex;flex-direction:column;padding:13% 11% 11% 17%;gap:7%}
.cover::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 2px,transparent 2px 4px);pointer-events:none}
.c-band{height:2px;background:currentColor;opacity:.55;width:60%;flex:none}
.c-title{font-family:var(--f-read);font-weight:600;font-size:clamp(.72rem,1.1vw + .45rem,1.02rem);line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.c-author{margin-top:auto;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;opacity:.82;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;z-index:1}
.cover.has-img img{opacity:1}
.cover.sm{width:84px}
.cover.lg .c-title{font-size:1.25rem}

/* empty */
.empty{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:center;padding:20px 0}
.empty h2{font-size:clamp(1.5rem,3vw,2.2rem);line-height:1.1;margin:8px 0 10px}
.empty .muted{max-width:52ch;margin-bottom:18px}
.sample-card{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;text-align:left;background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:16px;cursor:pointer}
.sample-card:hover{border-color:var(--accent)}
.sample-card>span{display:grid;gap:4px;min-width:0}
@media (max-width:720px){.empty{grid-template-columns:1fr}}

/* detail */
.crumbs{margin-bottom:14px}
.d-hero{display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:30px;align-items:start}
.d-cover .cover{max-width:220px}
.d-info{display:grid;gap:10px;min-width:0}
.d-title{font-size:clamp(1.5rem,3.4vw,2.3rem);line-height:1.08}
.d-authors{font-size:1.05rem;color:var(--muted)}
.d-meta{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:6px 0 4px;font-size:.92rem}
.d-meta dt{color:var(--muted)}
.d-meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
.d-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;grid-column:2}
@media (max-width:600px){.d-hero{grid-template-columns:110px 1fr;gap:16px}.d-title{font-size:1.35rem}.d-meta{font-size:.85rem}.d-actions{grid-column:1/-1}}
.d-block{margin-top:30px;display:grid;gap:12px}
.sec-h{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.sec-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.summary{max-width:68ch;font-family:var(--f-read);font-size:1.02rem;line-height:1.65}
.progbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px;max-width:640px}
.big{font-size:2rem;font-weight:500;letter-spacing:-.02em}
.pager{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pager input[type=number]{width:6.5em;text-align:center;border:1px solid var(--line);border-radius:10px;padding:.5em;background:var(--bg);font-family:var(--f-mono)}
input[type=range]{width:100%;accent-color:var(--accent)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:.45em .95em;cursor:pointer;font-size:.92rem}
.seg button[aria-checked="true"],.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* notes */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.note-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px;min-width:0;border-left:4px solid var(--line)}
.note-card.nc-yellow{border-left-color:var(--dot-yellow)}.note-card.nc-green{border-left-color:var(--dot-green)}.note-card.nc-blue{border-left-color:var(--dot-blue)}.note-card.nc-pink{border-left-color:var(--dot-pink)}
.nc-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:.8rem}
.nc-kind{font-weight:600}
.nc-date{margin-left:auto}
.nc-q{margin:0;font-family:var(--f-read);font-size:.98rem;line-height:1.55;overflow-wrap:anywhere;white-space:pre-wrap}
.nc-note{font-size:.92rem;overflow-wrap:anywhere;white-space:pre-wrap}
.nc-actions{display:flex;gap:16px;font-size:.88rem}
.empty-notes{max-width:60ch}

/* sheet */
.sheet{position:fixed;inset:0;z-index:80}
.sheet-backdrop{position:absolute;inset:0;background:rgba(8,14,11,.48)}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:6px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:var(--shadow);overscroll-behavior:contain}
@media (min-width:760px){.sheet-panel{left:auto;top:0;width:440px;max-height:none;border-radius:0;padding-top:calc(10px + env(safe-area-inset-top,0px))}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;background:var(--surface);padding:12px 0 10px;z-index:2}
.sheet-head h2{font-size:1.2rem}
.sheet-grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:6px auto 0}
@media (min-width:760px){.sheet-grab{display:none}}
.add-list{display:grid;gap:8px}
.add-opt{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;cursor:pointer}
.add-opt:hover{border-color:var(--accent)}
.add-opt strong{display:block;font-weight:600}
.add-opt .muted{font-size:.88rem}
.add-ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.add-ic .ic{width:24px;height:24px}
.form{display:grid;gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:.82rem;font-weight:600;color:var(--muted)}
.field input[type=text],.field input[type=number],.field input:not([type]),.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:.65em .75em;background:var(--bg)}
.field textarea{resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus{outline:0;border-color:var(--accent)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hint{font-size:.8rem;color:var(--muted)}
.banner{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:.9rem;display:flex;gap:10px;align-items:flex-start}
.banner .ic{color:var(--accent);margin-top:2px}
.form-err{color:var(--danger);font-size:.9rem}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.cover-row{display:flex;align-items:center;gap:14px}
.status{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:.95rem}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.scan-frame{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.scan-frame video{width:100%;height:100%;object-fit:cover;display:block}
.scan-box{position:absolute;left:8%;right:8%;top:30%;bottom:30%;border:2px solid rgba(255,255,255,.85);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scan-line{position:absolute;left:10%;right:10%;top:50%;height:2px;background:#E8524A;box-shadow:0 0 8px #E8524A;animation:scanl 1.6s ease-in-out infinite alternate}
@keyframes scanl{from{transform:translateY(-34px)}to{transform:translateY(34px)}}
.scan-img{width:100%;max-height:240px;object-fit:contain;border-radius:12px;background:var(--sunken)}
.dots{display:flex;gap:10px}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;background:var(--c)}
.dot[aria-checked="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.dot-yellow{--c:var(--dot-yellow)}.dot-green{--c:var(--dot-green)}.dot-blue{--c:var(--dot-blue)}.dot-pink{--c:var(--dot-pink)}
.q-read{margin:0;font-family:var(--f-read);font-size:1.02rem;line-height:1.6;padding:10px 12px;border-radius:10px;white-space:pre-wrap;max-height:30vh;overflow:auto}
.hlq-yellow{background:var(--hl-yellow)}.hlq-green{background:var(--hl-green)}.hlq-blue{background:var(--hl-blue)}.hlq-pink{background:var(--hl-pink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:10px}
.tabs button{border:0;background:none;padding:.6em .8em;cursor:pointer;border-bottom:2px solid transparent;font-weight:550;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.toc{display:grid}
.toc button{border:0;background:none;text-align:left;padding:.65em .4em;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.toc button[aria-current="true"]{color:var(--accent);font-weight:600}
.toc .mono{color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.pgrid button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:.45em 0;cursor:pointer;font-family:var(--f-mono);font-size:.85rem}
.set-grid{display:grid;gap:18px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:120;background:var(--ink);color:var(--bg);border-radius:12px;padding:.7em 1em;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);max-width:calc(100% - 32px);font-size:.92rem}
.toast button{border:0;background:none;color:inherit;font-weight:700;cursor:pointer;text-decoration:underline}
@media (max-width:719px){.toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);padding:0 20px;height:56px;font-weight:600;box-shadow:var(--shadow);cursor:pointer}
.fab .ic{width:22px;height:22px}

.splash{min-height:70vh;display:grid;place-content:center;justify-items:center;gap:14px;color:var(--muted)}
.splash .plate{width:64px;height:64px}

/* reader */
.reader{position:fixed;inset:0;z-index:50;background:var(--r-bg);color:var(--r-ink);display:grid;grid-template-rows:auto 1fr auto;--r-size:19px;--r-lh:1.7;--r-width:36em;--r-font:var(--f-read)}
.reader[data-rt="sepia"]{--r-bg:#F3E8D2;--r-ink:#3A2D1E;--r-muted:#7B6A55;color-scheme:light}
.reader[data-rt="noche"]{--r-bg:#0A0C0B;--r-ink:#C8CEC9;--r-muted:#7E8983;color-scheme:dark}
.r-top{display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px));border-bottom:1px solid color-mix(in srgb,var(--r-ink) 12%,transparent)}
.r-title{flex:1;min-width:0;display:grid;line-height:1.2}
.r-title strong{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-title span{font-size:.8rem;color:var(--r-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-tools{display:flex;align-items:center;gap:2px}

async function fetchJSON(url, ms = 9000) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) return null; return await r.json(); } catch (e) { return null; } finally { clearTimeout(t); }
}
async function webLookup(isbn) {
  const st = statusLine('Buscando el ISBN ' + isbn + ' en Google Books y Open Library…');
  Sheet.open('Buscando el libro', [st]);
  const out = { kind: 'fisico', isbn };
  const g = await fetchJSON('https://www.googleapis.com/books/v1/volumes?q=isbn:' + isbn);
  const v = g && g.items && g.items[0] && g.items[0].volumeInfo;
  if (v) {
    out.title = (v.title || '') + (v.subtitle ? ': ' + v.subtitle : '');
    out.authors = (v.authors || []).join(', '); out.publisher = v.publisher || '';
    out.year = (String(v.publishedDate || '').match(/\d{4}/) || [''])[0]; out.pages = v.pageCount || null;
    out.summary = String(v.description || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 700);
    const im = v.imageLinks; if (im && (im.thumbnail || im.smallThumbnail)) out.coverUrl = String(im.thumbnail || im.smallThumbnail).replace(/^http:/, 'https:').replace('&edge=curl', '');
  }
  if (!out.title || !out.coverUrl || !out.pages) {
    const o = await fetchJSON(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
    const d = o && o['ISBN:' + isbn];
    if (d) {
      if (!out.title) out.title = (d.title || '') + (d.subtitle ? ': ' + d.subtitle : '');
      if (!out.authors) out.authors = (d.authors || []).map(a => a.name).join(', ');
      if (!out.publisher) out.publisher = ((d.publishers || [])[0] || {}).name || '';
      if (!out.year) out.year = (String(d.publish_date || '').match(/\d{4}/) || [''])[0];
      if (!out.pages) out.pages = d.number_of_pages || null;
      if (!out.coverUrl && d.cover) out.coverUrl = String(d.cover.medium || d.cover.large || d.cover.small || '').replace(/^http:/, 'https:');
    }
  }
  if (!Sheet.isOpen()) return;
  if (out.title) openNewForm(out, { note: 'Datos encontrados en Google Books y Open Library. Revísalos antes de guardar.' });
  else if (!navigator.onLine) openNewForm(out, { note: 'Sin conexión a internet: completa los datos a mano.' });
  else openNewForm(out, { note: 'No encontré este ISBN en Google Books ni en Open Library. Completa los datos a mano.' });
}

/* ---------- live barcode scanner (camera) ---------- */
async function makeDetector() {
  if ('BarcodeDetector' in window) {
    try {
      const sup = await window.BarcodeDetector.getSupportedFormats();
      const f = ['ean_13', 'ean_8', 'upc_a', 'upc_e'].filter(x => sup.includes(x));
      if (f.length) { const d = new window.BarcodeDetector({ formats: f }); return async src => { const r = await d.detect(src); const b = r.find(x => /^97[89]/.test(x.rawValue)) || r[0]; return b ? b.rawValue : null; }; }
    } catch (e) {}
  }
  await loadScript(CDN.zxing);
  const Z = window.ZXing; const hints = new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E]);
  const reader = new Z.MultiFormatReader(); reader.setHints(hints);
  const c = document.createElement('canvas'); const ctx = c.getContext('2d', { willReadFrequently: true });
  let flip = false;
  return async v => {
    const W = v.videoWidth, H = v.videoHeight; if (!W || !H) return null;
    flip = !flip; const bandH = Math.round(H * (flip ? .45 : .8));
    const cw = Math.min(W, 1000), sc = cw / W; c.width = cw; c.height = Math.max(1, Math.round(bandH * sc));
    ctx.drawImage(v, 0, (H - bandH) / 2, W, bandH, 0, 0, c.width, c.height);
    const d = ctx.getImageData(0, 0, c.width, c.height).data; const lum = new Uint8ClampedArray(c.width * c.height);
    for (let i = 0, j = 0; i < d.length; i += 4, j++) lum[j] = (d[i] * 306 + d[i + 1] * 601 + d[i + 2] * 117) >> 10;
    try { return reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.RGBLuminanceSource(lum, c.width, c.height)))).getText(); } catch (e) { return null; }
  };
}
async function openScanner() {
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return pickFile($('#fileCam'), handleScanPhoto);
  const video = el('video', { playsinline: true, muted: true, autoplay: true }); video.muted = true;
  const st = el('p', { class: 'muted', text: 'Apunta al código de barras de la contraportada y mantenlo dentro del recuadro.' });
  let stream = null, stop = false, timer = 0;
  const cleanup = () => { stop = true; clearTimeout(timer); if (stream) stream.getTracks().forEach(t => t.stop()); };
  Sheet.open('Escanear código', [el('div', { class: 'form' },
    el('div', { class: 'scan-frame' }, video, el('div', { class: 'scan-box' }), el('div', { class: 'scan-line' })),
    st,
    el('div', { class: 'actions' },
      el('button', { class: 'btn', type: 'button', onclick: () => { cleanup(); pickFile($('#fileCam'), handleScanPhoto); } }, ic('camera'), 'Tomar una foto'),
      el('button', { class: 'btn ghost', type: 'button', onclick: typeIsbn }, ic('hash'), 'Escribir el ISBN')))]);
  Sheet.onclose = cleanup;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }); }
  catch (e) { st.textContent = 'No se pudo abrir la cámara. Revisa que Ex Libris tenga permiso de cámara en los ajustes del teléfono, o toma una foto.'; return; }
  if (stop) { stream.getTracks().forEach(t => t.stop()); return; }
  video.srcObject = stream; try { await video.play(); } catch (e) {}
  let detect;
  try { detect = await makeDetector(); } catch (e) { st.textContent = 'No se pudo iniciar el lector de códigos. Toma una foto o escribe el ISBN.'; return; }
  let seen = 0;
  const loop = async () => {
    if (stop) return;
    let code = null; try { code = await detect(video); } catch (e) {}
    if (stop) return;
    const isbn = normISBN(code);
    if (isbn) { cleanup(); Sheet.onclose = null; try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) {} lookupISBN(isbn); return; }
    if (code && ++seen > 4) st.textContent = `Leí el código ${code}, pero no es el ISBN de un libro. Busca el código que empieza por 978 o 979.`;
    timer = setTimeout(loop, 150);
  };
  loop();
}

function editBook(id) {

  Sheet.open('Editar libro', [bookForm(cur, {

      if (b.kind === 'fisico' && b.pages) { b.page = clamp(b.page || 0, 0, b.pages); b.progress = Math.round(b.page / b.pages * 1000) / 10; }
      if (b.status === 'terminado' && cur.status !== 'terminado') { b.progress = 100; if (b.kind === 'fisico') b.page = b.pages || b.page; b.finishedAt = Date.now(); }

/* ---------- import digital books ---------- */
function finishParsed({ meta, chapters, coverBlob, fmt, textless, pdfPages }) {
  let blocks = 0, chars = 0;
  for (const c of chapters) { blocks += c.blocks.length; for (const b of c.blocks) chars += b[1].length; }
  return { meta, content: textless ? null : { v: 1, chapters }, coverBlob, fmt, textless: !!textless, pdfPages: pdfPages || null, blocks, chars, chapters: chapters.length };
}
async function parseTXT(file) {
  const buf = await file.arrayBuffer();
  let text = new TextDecoder('utf-8').decode(buf);
  if ((text.match(/\uFFFD/g) || []).length > 3) text = new TextDecoder('windows-1252').decode(buf);
  text = text.replace(/\r\n?/g, '\n').replace(/^﻿/, '');
  let paras = /\n[ \t]*\n/.test(text) ? text.split(/\n[ \t]*\n+/) : text.split('\n');
  paras = paras.map(p => p.replace(/\s*\n\s*/g, ' ').replace(/\s+/g, ' ').trim()).filter(Boolean);
  const HEAD = /^((cap[ií]tulo|chapter|parte|libro|pr[oó]logo|ep[ií]logo|introducci[oó]n|prefacio)\b.{0,70}|[IVXLC]{1,7}\.?)$/i;
  const chapters = []; let cur = null;
  for (const p of paras) {
    if (p.length < 80 && HEAD.test(p)) { cur = { title: p, blocks: [['h', p]] }; chapters.push(cur); continue; }
    if (!cur) { cur = { title: 'Inicio', blocks: [] }; chapters.push(cur); }
    cur.blocks.push(['p', p]);
  }
  const ch = chapters.filter(c => c.blocks.length);
  if (!ch.length) throw new Error('El archivo está vacío.');
  return finishParsed({ meta: { title: stripExt(file.name), authors: '', isbn: '', year: '', publisher: '' }, chapters: ch, fmt: 'txt' });
}
function resolvePath(base, href) { try { return decodeURIComponent(new URL(href, 'https://epub.local/' + base).pathname.slice(1)); } catch (e) { return base + href; } }
function parseDoc(s) {
  let d = new DOMParser().parseFromString(s, 'application/xhtml+xml');
  if (d.getElementsByTagName('parsererror').length) d = new DOMParser().parseFromString(s, 'text/html');
  return d;
}
const BLOCK_TAGS = ['p', 'div', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'blockquote', 'li', 'pre', 'section', 'article', 'header', 'footer', 'aside', 'figure', 'figcaption', 'table', 'tr', 'td', 'th', 'dd', 'dt', 'ul', 'ol', 'dl', 'main', 'nav', 'hr', 'center'];

function extractBlocks(root) {
  const out = [];
  const typeOf = (tag, ctx) => /^h[1-6]$/.test(tag) ? 'h' : (ctx || (tag === 'blockquote' ? 'q' : tag === 'li' ? 'li' : tag === 'pre' ? 'pre' : 'p'));

    let buf = '';
    const flush = () => { const t = buf.replace(/\s+/g, ' ').trim(); if (t) out.push([ctx || 'p', t]); buf = ''; };
    for (const n of e.childNodes) {
      if (n.nodeType === 3) { buf += n.nodeValue; continue; }
      if (n.nodeType !== 1) continue;
      const tag = (n.localName || '').toLowerCase();
      if (SKIP.has(tag)) continue;
      if (tag === 'br') { buf += ' '; continue; }
      const hasBlock = n.querySelector && n.querySelector(BLOCK_SEL);
      if (BLOCK_SET.has(tag)) {
        flush();
        const nctx = tag === 'blockquote' ? 'q' : ctx;
        if (hasBlock) walk(n, nctx);
        else { const t = n.textContent.replace(/\s+/g, ' ').trim(); if (t) out.push([typeOf(tag, nctx), t]); }
      } else if (hasBlock) { flush(); walk(n, ctx); }

async function parseEPUB(file, say) {
  say('Abriendo el EPUB…');
  await loadScript(CDN.jszip);
  const zip = await window.JSZip.loadAsync(file);
  const readStr = p => { const f = zip.file(p) || zip.file(decodeURIComponent(p)); return f ? f.async('string') : Promise.resolve(null); };
  const xml = s => new DOMParser().parseFromString(s || '', 'application/xml');

  const opfPath = (xml(cont).getElementsByTagNameNS('*', 'rootfile')[0] || { getAttribute: () => null }).getAttribute('full-path');
  if (!opfPath) throw new Error('No se encontró el índice del EPUB.');

  const base = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/') + 1) : '';
  const tx = name => [...opf.getElementsByTagNameNS('*', name)].map(n => n.textContent.trim()).filter(Boolean);
  const meta = { title: tx('title')[0] || stripExt(file.name), authors: tx('creator').join(', '), publisher: tx('publisher')[0] || '', year: (tx('date')[0] || '').slice(0, 4), isbn: '' };
  for (const v of tx('identifier')) { const n = normISBN(v); if (n) { meta.isbn = n; break; } }
  const items = new Map();
  for (const it of opf.getElementsByTagNameNS('*', 'item')) items.set(it.getAttribute('id'), { href: resolvePath(base, it.getAttribute('href') || ''), type: it.getAttribute('media-type') || '', props: it.getAttribute('properties') || '' });
  const spineEl = opf.getElementsByTagNameNS('*', 'spine')[0];
  const spine = [...opf.getElementsByTagNameNS('*', 'itemref')].map(r => items.get(r.getAttribute('idref'))).filter(Boolean);
  const labels = new Map();
  try {
    const nav = [...items.values()].find(i => /\bnav\b/.test(i.props));
    if (nav) {
      const d = parseDoc(await readStr(nav.href) || ''); const nb = nav.href.includes('/') ? nav.href.slice(0, nav.href.lastIndexOf('/') + 1) : '';
      for (const a of d.getElementsByTagName('a')) { const h = a.getAttribute('href'); const t = a.textContent.replace(/\s+/g, ' ').trim(); if (h && t) { const p = resolvePath(nb, h.split('#')[0]); if (!labels.has(p)) labels.set(p, t); } }
    } else {
      const ncx = spineEl && items.get(spineEl.getAttribute('toc'));
      if (ncx) {
        const d = xml(await readStr(ncx.href)); const nb = ncx.href.includes('/') ? ncx.href.slice(0, ncx.href.lastIndexOf('/') + 1) : '';
        for (const np of d.getElementsByTagNameNS('*', 'navPoint')) {
          const t = (np.getElementsByTagNameNS('*', 'text')[0] || {}).textContent; const src = (np.getElementsByTagNameNS('*', 'content')[0] || { getAttribute: () => null }).getAttribute('src');
          if (t && src) { const p = resolvePath(nb, src.split('#')[0]); if (!labels.has(p)) labels.set(p, t.trim()); }
        }
      }
    }
  } catch (e) {}
  const chapters = []; let k = 0;
  for (const it of spine) {
    k++;
    if (!/html|xml/.test(it.type) && !/\.x?html?$/i.test(it.href)) continue;
    say(`Leyendo sección ${k} de ${spine.length}…`);
    const s = await readStr(it.href); if (!s) continue;
    const d = parseDoc(s); const body = d.body || d.getElementsByTagName('body')[0] || d.documentElement;
    const blocks = extractBlocks(body); if (!blocks.length) continue;
    const h = blocks.find(b => b[0] === 'h');
    chapters.push({ title: labels.get(it.href) || (h ? h[1].slice(0, 90) : 'Sección ' + (chapters.length + 1)), blocks });
  }
  if (!chapters.length) throw new Error('No se encontró texto en este EPUB.');

  try {
    let ci = [...items.values()].find(i => /cover-image/.test(i.props));
    if (!ci) { const m = [...opf.getElementsByTagNameNS('*', 'meta')].find(x => x.getAttribute('name') === 'cover'); if (m) ci = items.get(m.getAttribute('content')); }
    if (ci && /^image\/(jpeg|png|webp|gif)$/.test(ci.type)) { const f = zip.file(ci.href); if (f) coverBlob = new Blob([await f.async('blob')], { type: ci.type }); }
  } catch (e) {}

$('#rScroll').addEventListener('scroll', () => { if (scrollRaf) return; scrollRaf = requestAnimationFrame(() => { scrollRaf = 0; R.onScroll(); }); }, { passive: true });
$('#rSeek').addEventListener('input', e => { if (R.mode === 'text') R.seek(+e.target.value); });
$('#rSeek').addEventListener('change', e => { if (R.mode === 'page') R.seek(+e.target.value); e.target.blur(); });
$('#rDone').onclick = () => { setStatus(R.bookId, 'terminado'); $('#rDone').hidden = true; toast('¡Libro terminado!'); };
let selT;
document.addEventListener('selectionchange', () => { clearTimeout(selT); selT = setTimeout(() => R.checkSel(), 220); });
$$('#selbar .dot').forEach(d => { d.addEventListener('mousedown', e => e.preventDefault()); d.onclick = () => R.createHl(d.dataset.c, false); });
$('#selNote').addEventListener('mousedown', e => e.preventDefault());
$('#selNote').onclick = () => R.createHl('yellow', true);
$('#selCopy').addEventListener('mousedown', e => e.preventDefault());
$('#selCopy').onclick = () => { if (R.pending) copyText(R.pending.text, 'Texto copiado'); };
$('#rText').addEventListener('click', e => {
  const m = e.target.closest && e.target.closest('mark.hl'); if (!m) return;
  const sel = getSelection(); if (sel && !sel.isCollapsed) return;
  const n = S.notes.get(m.dataset.n); if (n) hlEditor(n);
});
addEventListener('keydown', e => {
  if (!R.open || Sheet.isOpen() || R.mode !== 'page') return;
  if (e.key === 'ArrowRight') R.renderPage(R.page + 1); else if (e.key === 'ArrowLeft') R.renderPage(R.page - 1);
});
let resizeT; addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (!R.open) return; if (R.mode === 'text') { const c = R.cur; R.measure(); R.scrollToBlock(c); } else R.renderPage(R.page); }, 200); });

  ['p', 'En un lugar de la Mancha, de cuyo nombre no quiero acordarme, no ha mucho tiempo que vivía un hidalgo de los de lanza en astillero, adarga antigua, rocín flaco y galgo corredor. Una olla de algo más vaca que carnero, salpicón las más noches, duelos y quebrantos los sábados, lantejas los viernes, algún palomino de añadidura los domingos, consumían las tres partes de su hacienda. El resto della concluían sayo de velarte, calzas de velludo para las fiestas, con sus pantuflos de lo mesmo, y los días de entresemana se honraba con su vellorí de lo más fino. Tenía en su casa una ama que pasaba de los cuarenta y una sobrina que no llegaba a los veinte, y un mozo de campo y plaza que así ensillaba el rocín como tomaba la podadera. Frisaba la edad de nuestro hidalgo con los cincuenta años. Era de complexión recia, seco de carnes, enjuto de rostro, gran madrugador y amigo de la caza. Quieren decir que tenía el sobrenombre de Quijada, o Quesada, que en esto hay alguna diferencia en los autores que deste caso escriben, aunque por conjeturas verisímiles se deja entender que se llamaba Quijana. Pero esto importa poco a nuestro cuento: basta que en la narración dél no se salga un punto de la verdad.'],

  ['p', 'En resolución, él se enfrascó tanto en su letura, que se le pasaban las noches leyendo de claro en claro, y los días de turbio en turbio; y así, del poco dormir y del mucho leer, se le secó el celebro, de manera que vino a perder el juicio. Llenósele la fantasía de todo aquello que leía en los libros, así de encantamentos como de pendencias, batallas, desafíos, heridas, requiebros, amores, tormentas y disparates imposibles; y asentósele de tal modo en la imaginación que era verdad toda aquella máquina de aquellas sonadas soñadas invenciones que leía, que para él no había otra historia más cierta en el mundo. Decía él que el Cid Ruy Díaz había sido muy buen caballero, pero que no tenía que ver con el Caballero de la Ardiente Espada, que de solo un revés había partido por medio dos fieros y descomunales gigantes. Mejor estaba con Bernardo del Carpio, porque en Roncesvalles había muerto a Roldán el encantado, valiéndose de la industria de Hércules, cuando ahogó a Anteo, el hijo de la Tierra, entre los brazos. Decía mucho bien del gigante Morgante, porque, con ser de aquella generación gigantea, que todos son soberbios y descomedidos, él solo era afable y bien criado. Pero, sobre todos, estaba bien con Reinaldos de Montalbán, y más cuando le veía salir de su castillo y robar cuantos topaba, y cuando en allende robó aquel ídolo de Mahoma que era todo de oro, según dice su historia. Diera él, por dar una mano de coces al traidor de Galalón, al ama que tenía, y aun a su sobrina de añadidura.'],
  ['p', 'En efeto, rematado ya su juicio, vino a dar en el más estraño pensamiento que jamás dio loco en el mundo, y fue que le pareció convenible y necesario, así para el aumento de su honra como para el servicio de su república, hacerse caballero andante, y irse por todo el mundo con sus armas y caballo a buscar las aventuras y a ejercitarse en todo aquello que él había leído que los caballeros andantes se ejercitaban, deshaciendo todo género de agravio, y poniéndose en ocasiones y peligros donde, acabándolos, cobrase eterno nombre y fama. Imaginábase el pobre ya coronado por el valor de su brazo, por lo menos, del imperio de Trapisonda; y así, con estos tan agradables pensamientos, llevado del estraño gusto que en ellos sentía, se dio priesa a poner en efeto lo que deseaba.'],

  ['p', 'Fue luego a ver su rocín, y, aunque tenía más cuartos que un real y más tachas que el caballo de Gonela, que tantum pellis et ossa fuit, le pareció que ni el Bucéfalo de Alejandro ni Babieca el del Cid con él se igualaban. Cuatro días se le pasaron en imaginar qué nombre le pondría; porque, según se decía él a sí mesmo, no era razón que caballo de caballero tan famoso, y tan bueno él por sí, estuviese sin nombre conocido; y ansí, procuraba acomodársele de manera que declarase quién había sido, antes que fuese de caballero andante, y lo que era entonces; pues estaba muy puesto en razón que, mudando su señor estado, mudase él también el nombre, y le cobrase famoso y de estruendo, como convenía a la nueva orden y al nuevo ejercicio que ya profesaba. Y así, después de muchos nombres que formó, borró y quitó, añadió, deshizo y tornó a hacer en su memoria e imaginación, al fin le vino a llamar Rocinante, nombre, a su parecer, alto, sonoro y significativo de lo que había sido cuando fue rocín, antes de lo que ahora era, que era antes y primero de todos los rocines del mundo.'],
